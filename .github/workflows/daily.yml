# AI 赛事雷达 · 手动兜底更新
#
# 方案 A：本机 Windows 计划任务每天 08:00 抓取、核验、生成并 push；
# GitHub Pages 由 pages.yml 在 push 后部署。本 workflow 仅保留手动触发，
# 用于本机长期离线时的临时兜底，不再按 schedule 自动运行。
name: daily-refresh-manual

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://race.howfun.cn' }}

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取平台源（天池 / 讯飞 / DataFountain / AI Studio / DoraHacks / 活动行）
        run: |
          timeout 180 python scripts/fetch_tianchi.py || echo "::warning::天池抓取失败，沿用旧候选"
          timeout 180 python scripts/fetch_xfyun.py || echo "::warning::讯飞抓取失败，沿用旧候选"
          timeout 180 python scripts/fetch_datafountain.py || echo "::warning::DataFountain 抓取失败，沿用旧候选"
          timeout 180 python scripts/fetch_aistudio.py || echo "::warning::AI Studio 抓取失败，沿用旧候选"
          timeout 180 python scripts/fetch_dora.py || echo "::warning::DoraHacks 抓取失败，沿用旧候选"
          timeout 180 python scripts/fetch_hdx.py || echo "::warning::活动行抓取失败，沿用旧候选"

      - name: 抓取官方活动站（知乎等自有活动页）
        run: timeout 180 python scripts/fetch_event_sites.py

      - name: 抓取扩展信源（魔搭活动 / 和鲸 / biendata）
        run: timeout 180 python scripts/collect_sources.py || echo "::warning::扩展信源抓取失败，沿用旧候选"

      - name: 抓取 Luma 社区日历
        run: timeout 120 python scripts/collect_luma.py || echo "::warning::Luma 抓取失败，沿用旧候选"

      - name: 抓取线索源（联谱 / 湾区AI日历）
        run: |
          timeout 180 python scripts/collect_lianpu.py || echo "::warning::联谱线索抓取失败"
          timeout 180 python scripts/collect_wqai.py || echo "::warning::湾区线索抓取失败"
          timeout 180 python scripts/enrich_wechat_leads.py --limit 2 || echo "::warning::公众号线索补全失败"

      - name: 核验 + 去重 + 入库
        run: timeout 600 python scripts/verify.py

      - name: 生成站点
        run: timeout 180 python scripts/build_site.py

      - name: 提交去重账本与站点
        run: |
          git config user.name "ai-race-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/races.db data/races.json site
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: daily refresh $(date -u +%F)"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 GitHub Pages
        uses: actions/deploy-pages@v4
