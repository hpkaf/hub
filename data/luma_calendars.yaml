# Luma 日历信源（https://luma.com/<slug>）
#
# 用法：脚本优先用 api_id 拉 ICS（https://api.lu.ma/ics/get?entity=calendar&id=...），
# ICS 是官方导出的日历文件，比解析页面 HTML 稳，且一次能拿到该社区全部活动。
# slug 用于兜底：没有 api_id 时先抓页面解析出 api_id。
# 维护：每季度把新发现的 AI / 黑客松社区日历加进来（带 api_id 最省事）。
